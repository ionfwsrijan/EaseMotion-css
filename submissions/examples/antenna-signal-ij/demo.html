<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-antenna-signal</title>
</head>
<body>
<main class="ats-card">
  <header class="ats-head">
    <h1 class="ats-title">Relay 9</h1>
    <span class="ats-freq">2.4 GHz</span>
  </header>
  <section class="ats-stage" aria-label="antenna tower">
    <span class="ats-mast"></span>
    <span class="ats-arm"></span>
    <span class="ats-dish"></span>
    <span class="ats-ring ats-ring-1"></span>
    <span class="ats-ring ats-ring-2"></span>
    <span class="ats-ring ats-ring-3"></span>
    <span class="ats-arc"></span>
  </section>
  <section class="ats-bars" aria-label="signal strength">
    <span class="ats-bar ats-bar-1"></span>
    <span class="ats-bar ats-bar-2"></span>
    <span class="ats-bar ats-bar-3"></span>
    <span class="ats-bar ats-bar-4"></span>
  </section>
  <section class="ats-read" aria-label="signal readout">
    <strong class="ats-rssi">-62 dBm</strong>
    <span class="ats-snr">26 dB</span>
  </section>
  <footer class="ats-foot">
    <span class="ats-led">Linked</span>
    <span class="ats-ups">UPS ok</span>
  </footer>
</main>
</body>
</html>
