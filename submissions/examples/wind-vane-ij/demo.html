<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-wind-vane</title>
</head>
<body>
<main class="wvn-card">
  <header class="wvn-head">
    <h1 class="wvn-title">Mast Top</h1>
    <span class="wvn-height">12 m</span>
  </header>
  <section class="wvn-stage" aria-label="wind vane">
    <span class="wvn-compass">
      <span class="wvn-dir wvn-dir-n">N</span>
      <span class="wvn-dir wvn-dir-e">E</span>
      <span class="wvn-dir wvn-dir-s">S</span>
      <span class="wvn-dir wvn-dir-w">W</span>
    </span>
    <span class="wvn-needle"></span>
    <span class="wvn-spindle"></span>
    <span class="wvn-cup wvn-cup-1"></span>
    <span class="wvn-cup wvn-cup-2"></span>
  </section>
  <section class="wvn-read" aria-label="wind readout">
    <strong class="wvn-heading">NW</strong>
    <span class="wvn-speed">14 km/h</span>
  </section>
  <footer class="wvn-foot">
    <span class="wvn-gust">gust 21</span>
    <span class="wvn-cal">calibrated</span>
  </footer>
</main>
</body>
</html>
